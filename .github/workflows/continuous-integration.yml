name: CI
on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded PR checks; keep every non-PR invocation independent.
concurrency:
  group: continuous-integration.yml-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prettier:
    timeout-minutes: 60
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run code formatting check
        run: yarn run fmt:check
  playwright-tests:
    timeout-minutes: 60
    name: Playwright tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "yarn"
      - name: Install dependencies
        run: |
          yarn add bos-workspace
          npx playwright install-deps
          npx playwright install
      - name: Run tests
        run: |
          npx playwright test
